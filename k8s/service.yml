apiVersion: v1
kind: Service
metadata:
  name: go-web-app-service
  labels:
    app: go-web-app
spec:
  type: ClusterIP  # Changed from "clusterIP" to "ClusterIP" (case-sensitive)
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP  # Added for clarity (optional)
  selector:
    app: go-web-app
